# Every platform against the same protocol fixtures, on every push.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Server and web (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fixtures are up to date
        run: |
          node fixtures/tools/make-fixtures.mjs
          git diff --exit-code fixtures/
      - name: Server tests
        run: npm test
        working-directory: server
      - name: Web tests (fixtures, and the room client against the real server)
        run: npm test
        working-directory: web

  swift-linux:
    name: LiveCore (Swift on Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
        working-directory: ios/SpaceNotesLive

  ios:
    name: iPad packages (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: LiveCore tests on macOS
        run: swift test
        working-directory: ios/SpaceNotesLive
      # LiveUI (SwiftUI + PencilKit) and the LiveKit video package only exist
      # on iOS; this is the first place they are compiled for real.
      - name: Build LiveUI for iOS
        run: xcodebuild -scheme LiveUI -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO
        working-directory: ios/SpaceNotesLive
      - name: Build SpaceNotesLiveVideo for iOS
        working-directory: ios/SpaceNotesLiveVideo
        run: |
          xcodebuild -list
          # SwiftPM names the scheme after the package or the product,
          # depending on the Xcode version; build whichever exists.
          SCHEME=$(xcodebuild -list -json | python3 -c "import json,sys; s=json.load(sys.stdin)['workspace']['schemes']; print(next(x for x in ['SpaceNotesLiveVideo','LiveVideo','SpaceNotesLiveVideo-Package'] if x in s))")
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO

  android:
    name: Android modules (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already carries the Android SDK at $ANDROID_HOME.
      - name: Android platform 37
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"
      - name: Test and build
        run: ./gradlew :live-core:test :live-ui:testDebugUnitTest :live-ui:assembleDebug :live-video:assembleDebug :live-ui:lintDebug :live-video:lintDebug
        working-directory: android
